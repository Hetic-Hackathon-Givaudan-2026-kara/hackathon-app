# La stack de développement. Versions figées : les mêmes qu'en production.
name: hackathon

services:
  # Le poste de travail : VS Code s'y attache, on y lance l'API et le front
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - .:/workspace:cached
    environment:
      # Use http://localhost:3000 to target the API launched inside dev instead.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:3000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      # Rend l'hôte joignable sous Linux (Docker Desktop le fait déjà)
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    command: npm run dev -w api
    volumes:
      - .:/workspace:cached
    ports:
      - '3000:3000'
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      # Les données, dans un dossier du projet (ignoré par git)
      - ./db/data:/var/lib/postgresql/data
      # Schéma et données de test, joués au premier démarrage
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 10
